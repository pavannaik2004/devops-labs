apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx
spec:
  type: NodePort # expose the service on a port of every node
  selector:
    app: nginx # send traffic to pods labelled app=nginx (must match the deployment)
  ports:
    - name: 80-80
      protocol: TCP
      port: 80 # port of the service inside the cluster
      targetPort: 80 # containerPort of the nginx pods
      nodePort: 30080 # open in the browser at http://localhost:30080
